name: safetrack
description: SafeTrack - Smart Bus Tracking & Safety System Mobile App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.8.1
  cloud_functions: ^5.0.1
  cloud_firestore: ^5.6.0
  provider: ^6.1.1
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  flutter_svg: ^2.0.10
  http: ^1.2.1
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.svg
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700